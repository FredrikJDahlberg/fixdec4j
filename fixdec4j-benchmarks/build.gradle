plugins {
    id 'me.champeau.jmh' version '0.7.2'
}

version = '1.0.0'

sourceSets {
    jmh {
        java.srcDirs = ['src/jmh/java']
    }
}

dependencies {
    implementation project(':fixdec4j')
    compileOnly('org.openjdk.jmh:jmh-core:1.37')
    annotationProcessor('org.openjdk.jmh:jmh-generator-annprocess:1.37')
}

jmh {
    // Select benchmarks with a regexp, e.g. ./gradlew jmh -Pbenchmarks=Decimal64Flyweight
    includes = [project.findProperty('benchmarks') ?: 'Benchmark']
}
